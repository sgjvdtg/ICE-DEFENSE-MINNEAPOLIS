<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE Defense: Minneapolis</title>

<style>
    body {
        background-color: #000;
        color: #FFFF00;
        font-family: Arial Black, Gadget, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    h1 {
        font-size: 2.5rem;
        margin: 20px 0;
        text-transform: uppercase;
    }

    .game-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        width: 100%;
    }

    .side-panel {
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .btn {
        background-color: #FFFF00;
        color: #000;
        border: none;
        padding: 14px 32px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
    }

    .iframe-container {
        width: 440px;
        height: 443px;
        background: #000;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 25px rgba(255,255,0,.25);
    }

    .iframe-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }

    /* FULLSCREEN */
    .iframe-container:fullscreen {
        width: 100vw;
        height: 100vh;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .iframe-container:fullscreen iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }

    .view-counter-container {
        margin-top: 30px;
        text-align: center;
    }

    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.95);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
</style>
</head>

<body>

<h1>ICE Defense: Minneapolis</h1>

<div class="game-layout">

    <div class="side-panel">
        <button class="btn" onclick="openControls()">Controls</button>
        <button class="btn" onclick="toggleGameFullscreen()">Fullscreen</button>
    </div>

    <div class="iframe-container" id="gameContainer">
        <iframe
            src="https://studio.code.org/projects/gamelab/qzqEbFqO-F6v8-2NzF-9Nj8-8zFbOFIF162O/embed?nosource"
            allowfullscreen>
        </iframe>
    </div>

    <div class="side-panel">
        <button class="btn" onclick="location.reload()">Restart Game</button>
    </div>

</div>

<div class="view-counter-container">
    <p>PLAYERS ONLINE NOW:</p>
    <script>
        var _wau = _wau || [];
        _wau.push(["classic", "icedefense", "ots"]);
    </script>
    <script async src="//waust.at/c.js"></script>
</div>

<div id="controlsModal" class="modal-overlay">
    <div style="text-align:center;">
        <img src="controlPage.gif" style="max-width:90%; height:auto;">
        <br><br>
        <button class="btn" onclick="closeControls()">Back</button>
    </div>
</div>

<script>
    function openControls() {
        document.getElementById("controlsModal").style.display = "flex";
    }

    function closeControls() {
        document.getElementById("controlsModal").style.display = "none";
    }

    async function toggleGameFullscreen() {
        const game = document.getElementById("gameContainer");

        try {
            if (!document.fullscreenElement) {
                await game.requestFullscreen();
            } else {
                await document.exitFullscreen();
            }
        } catch (err) {
            console.error(err);
        }
    }

    window.addEventListener(
        "keydown",
        function(e) {
            if (
                ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]
                .includes(e.code)
            ) {
                e.preventDefault();
            }
        },
        { passive: false }
    );
</script>

</body>
</html>

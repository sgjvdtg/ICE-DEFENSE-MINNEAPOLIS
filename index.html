<!DOCTYPE html>
<html>
  <head>
    <title>ICE Defense: Minneapolis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
    <script src="gamelab-api.js"></script>
    <link href="gamelab.css" rel="stylesheet" type="text/css">
    <script src="p5.js"></script>
    <script src="p5.play.js"></script>
    <script src="code.js"></script>
    <style>
      /* Main Canvas Game Window Positioning */
      #sketch.web {
        position: absolute !important;
        top: 150px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 400px !important;
        height: 565px !important;
        box-shadow: 0 0 25px rgba(255, 255, 0, 0.25);
        border-radius: 4px;
        background-color: #111;
        z-index: 1;
      }

      /* Desktop Layout System Setup */
      .arcade-interface {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        color: #FFFF00;
        font-family: 'Arial Black', Gadget, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        box-sizing: border-box;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        z-index: 10;
        pointer-events: none; /* Allows clicks to pass through to the game underneath */
      }

      /* Arcade Header Title */
      .arcade-interface h1 {
        font-size: 2.5rem;
        margin-top: 30px;
        margin-bottom: 0;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        pointer-events: auto;
      }

      /* Button Wrapper Layout */
      .arcade-row {
        position: absolute;
        top: 410px; /* Aligns side buttons with the center height of the game canvas */
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        max-width: 1000px;
        display: flex;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 0 20px;
      }

      /* Custom Neon Yellow Control Buttons */
      .btn {
        background-color: #FFFF00;
        color: #000000;
        border: none;
        padding: 14px 32px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        transition: transform 0.1s ease, background-color 0.2s ease;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(255, 255, 0, 0.2);
        pointer-events: auto; /* Makes sure buttons stay clickable */
      }

      .btn:hover {
        background-color: #e6e600;
        transform: scale(1.05);
      }

      /* --- CONTROLS OVERLAY SCREEN --- */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        z-index: 2000; /* Sits completely on top of everything else */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        pointer-events: auto;
      }

      .modal-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 100%;
      }

      .controls-image {
        width: 100%;
        max-width: 1000px;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      /* Hidden backend layouts required by the local Code.org game loop */
      body.expo { background-color: black; }
      #sketch.expo.no-controls { top: 82px; }
    </style>
  </head>
  <body class="web">

    <div id="sketch" class="web"></div>

    <div class="arcade-interface">
        <h1>ICE Defense: Minneapolis</h1>
        
        <div class="arcade-row">
            <button class="btn" onclick="openControls()">Controls</button>
            
            <button class="btn" onclick="location.reload();">Restart Game</button>
        </div>
    </div>

    <div id="soft-buttons" style="display: none">
      <button id="leftButton" disabled class="arrow"></button>
      <button id="rightButton" disabled class="arrow"></button>
      <button id="upButton" disabled class="arrow"></button>
      <button id="downButton" disabled class="arrow"></button>
    </div>
    <div id="studio-dpad" style="display: none"></div>
    <div id="studio-action1" style="display: none"></div>
    <div id="studio-action2" style="display: none"></div>

    <div id="controlsModal" class="modal-overlay">
        <div class="modal-content">
            <img src="controlPage.png" alt="Game Controls" class="controls-image">
            <button class="btn" onclick="closeControls()">Back To Game</button>
        </div>
    </div>

    <script>
        function openControls() {
            document.getElementById('controlsModal').style.display = 'flex';
        }

        function closeControls() {
            document.getElementById('controlsModal').style.display = 'none';
        }

        // Locks the desktop window from jumping when directional items are pressed
        window.addEventListener("keydown", function(e) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>
  </body>
</html>

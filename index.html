<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Defense: Minneapolis</title>
    <style>
        body {
            background-color: #000000;
            color: #FFFF00;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { font-size: 2.5rem; margin: 20px 0; text-transform: uppercase; }

        .game-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            width: 100%;
        }

        .side-panel { width: 220px; display: flex; flex-direction: column; gap: 15px; }

        .btn {
            background-color: #FFFF00;
            color: #000000;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* The Container Setup */
        .iframe-container {
            width: 440px;
            height: 443px;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.25);
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .iframe-container iframe {
            width: 440px;
            height: 443px;
            border: 0;
        }

        /* --- FULLSCREEN OPTIMIZED MODE --- */
        .iframe-container:fullscreen {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            background: #000 !important;
        }

        .iframe-container:fullscreen iframe {
            /* Locks aspect ratio to square */
            width: 100vh !important;
            height: 100vh !important;
            /* Crops the footer/top bars */
            clip-path: inset(5% 0 10% 0) !important;
        }

        .view-counter-container { margin-top: 30px; text-align: center; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>ICE Defense: Minneapolis</h1>

    <div class="game-layout">
        <div class="side-panel">
            <button class="btn" onclick="openControls()">Controls</button>
            <button class="btn" onclick="toggleGameFullscreen()">Fullscreen</button>
        </div>
        
        <div class="iframe-container" id="gameContainer">
            <iframe src="https://studio.code.org/projects/gamelab/qzqEbFqO-F6v8-2NzF-9Nj8-8zFbOFIF162O/embed?nosource"></iframe>
        </div>
        
        <div class="side-panel">
            <button class="btn" onclick="location.reload();">Restart Game</button>
        </div>
    </div>

    <div class="view-counter-container">
        <p>PLAYERS ONLINE NOW:</p>
        <script id="_wauots">var _wau = _wau || []; _wau.push(["classic", "icedefense", "ots"]);</script>
        <script async src="//waust.at/c.js"></script>
    </div>

    <div id="controlsModal" class="modal-overlay">
        <div style="text-align:center;">
            <img src="controlPage.gif" style="max-width:90%; height:auto;">
            <br><button class="btn" onclick="closeControls()">Back</button>
        </div>
    </div>

    <script>
        function openControls() { document.getElementById('controlsModal').style.display = 'flex'; }
        function closeControls() { document.getElementById('controlsModal').style.display = 'none'; }

        function toggleGameFullscreen() {
            let elem = document.getElementById("gameContainer");
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener("keydown", e => {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
        }, {passive: false});
    </script>
</body>
</html>

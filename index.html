<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Defense: Minneapolis</title>
    <style>
        /* Base page styling */
        body {
            background-color: #000000;
            color: #FFFF00; /* Neon Yellow */
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* Prevents the main page from scrolling completely */
        }

        /* Title styling */
        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout wrapper - holds the entire row together */
        .game-layout {
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 50px;
            width: 100%;
            max-width: 1200px;
            margin-top: 10px; 
        }

        /* Side columns for the buttons */
        .side-panel {
            width: 220px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Button styling matching the neon yellow block look */
        .btn {
            background-color: #FFFF00;
            color: #000000;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s ease, background-color 0.2s ease;
            white-space: nowrap; 
            box-shadow: 0 4px 10px rgba(255, 255, 0, 0.1);
        }

        .btn:hover {
            background-color: #e6e600;
            transform: scale(1.05);
        }

        /* Container acts as the rigid cropping window */
        .iframe-container {
            width: 440px;
            height: 443px; 
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.25);
            border-radius: 4px;
            overflow: hidden; 
            background: #111;
            display: flex;
            position: relative;
        }

        /* Forces the iframe to render at full scale, but shifts it to hide the footer */
        .iframe-container iframe {
            width: 440px;
            height: 443px; 
            border: 0px;
            position: absolute;
            top: 0;
            left: 0;
            transform: translateY(0px); 
            margin-bottom: -45px;
        }

        /* --- VIEW COUNTERS STYLING --- */
        .view-counter-container {
            display: flex;
            flex-direction: row;
            gap: 60px;
            margin-top: 30px;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .view-counter {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #FFFF00;
        }

        .view-counter p {
            margin-bottom: 10px;
            margin-top: 0;
        }

        /* --- CONTROLS OVERLAY SCREEN (MODAL) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100%;
        }

        .controls-image {
            width: 100%;
            max-width: 1000px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 950px) {
            body { overflow-y: auto; }
            .game-layout { flex-direction: column; gap: 25px; }
            .side-panel { width: auto; }
            .view-counter-container { flex-direction: column; gap: 30px; } 
        }
    </style>
</head>
<body>

    <h1>ICE Defense: Minneapolis</h1>

    <div class="game-layout">
        <div class="side-panel">
            <button class="btn" onclick="openControls()">Controls</button>
        </div>
        
        <div class="iframe-container">
            <iframe src="https://studio.code.org/projects/gamelab/qzqEbFqO-F6v8-2NzF-9Nj8-8zFbOFIF162O/embed?nosource"></iframe>
        </div>
        
        <div class="side-panel">
            <button class="btn" onclick="location.reload();">Restart Game</button>
        </div>
    </div>

    <div class="view-counter-container">
        
        <div class="view-counter">
            <p>PLAYERS ONLINE NOW:</p>
            <script id="_wauots">var _wau = _wau || []; _wau.push(["classic", "icedefense", "ots"]);</script>
            <script async src="//waust.at/c.js"></script>
        </div>

    </div>

    <div id="controlsModal" class="modal-overlay">
        <div class="modal-content">
            <img src="controlPage.gif" alt="Game Controls" class="controls-image">
            <button class="btn" onclick="closeControls()">Back To Game</button>
        </div>
    </div>

    <script>
        function openControls() {
            document.getElementById('controlsModal').style.display = 'flex';
        }

        function closeControls() {
            document.getElementById('controlsModal').style.display = 'none';
        }

        // Catch and disable window scrolling completely for keys used in the game
        window.addEventListener("keydown", function(e) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>

</body>
</html>

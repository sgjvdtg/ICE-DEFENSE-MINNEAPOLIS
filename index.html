<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICE Defense: Minneapolis</title>
    <style>
        /* Base page styling */
        body {
            background-color: #000000;
            color: #FFFF00; /* Neon Yellow */
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Aligns content from the top down naturally */
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* Prevents the main page from scrolling completely */
        }

        /* Title styling */
        h1 {
            font-size: 2.5rem;
            margin-top: 20px;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout wrapper - holds the entire row together */
        .game-layout {
            display: flex;
            align-items: center; /* Forces the buttons to line up exactly with the center of the iframe box */
            justify-content: center;
            gap: 50px;
            width: 100%;
            max-width: 1200px;
            margin-top: 10px; /* Optional spacing below the header */
        }

        /* Side columns for the buttons - keeps spacing equal on both sides */
        .side-panel {
            width: 220px; /* Fixed width prevents layout shifting */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Button styling matching the neon yellow block look */
        .btn {
            background-color: #FFFF00;
            color: #000000;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s ease, background-color 0.2s ease;
            white-space: nowrap; 
            box-shadow: 0 4px 10px rgba(255, 255, 0, 0.1);
        }

        .btn:hover {
            background-color: #e6e600;
            transform: scale(1.05);
        }

        /* Container locked strictly to your exact Code.org specs */
        .iframe-container {
            width: 440px;
            height: 600px;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.25);
            border-radius: 4px;
            overflow: hidden;
            background: #111;
            display: flex;
        }

        /* Forces iframe to fill the container layout border perfectly */
        .iframe-container iframe {
            width: 100%;
            height: 100%;
        }

        /* --- CONTROLS OVERLAY SCREEN (MODAL) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 100%;
        }

        .controls-image {
            width: 100%;
            max-width: 1000px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Stacking layout nicely on small screens */
        @media (max-width: 950px) {
            body {
                overflow-y: auto; /* Allow scrolling on smaller screens if items stack */
            }
            .game-layout {
                flex-direction: column;
                gap: 25px;
            }
            .side-panel {
                width: auto;
            }
        }
    </style>
</head>
<body>

    <h1>ICE Defense: Minneapolis</h1>

    <div class="game-layout">
        <div class="side-panel">
            <button class="btn" onclick="openControls()">Controls</button>
        </div>
        
        <div class="iframe-container">
            <iframe style="border: 0px;" src="https://studio.code.org/projects/gamelab/qzqEbFqO-F6v8-2NzF-9Nj8-8zFbOFIF162O/embed?nosource"></iframe>
        </div>
        
        <div class="side-panel">
            <button class="btn" onclick="location.reload();">Restart Game</button>
        </div>
    </div>

    <div id="controlsModal" class="modal-overlay">
        <div class="modal-content">
            <img src="controlPage.png" alt="Game Controls" class="controls-image">
            <button class="btn" onclick="closeControls()">Back To Game</button>
        </div>
    </div>

    <script>
        function openControls() {
            document.getElementById('controlsModal').style.display = 'flex';
        }

        function closeControls() {
            document.getElementById('controlsModal').style.display = 'none';
        }

        // Catch and disable window scrolling completely for keys used in the game
        window.addEventListener("keydown", function(e) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>

</body>
</html>

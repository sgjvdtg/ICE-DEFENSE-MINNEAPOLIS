<!DOCTYPE html>
<html>
  <head>
    <title>ICE Defense: Minneapolis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://code.jquery.com/jquery-1.12.1.min.js"></script>
    <script src="gamelab-api.js"></script>
    <link href="gamelab.css" rel="stylesheet" type="text/css">
    <script src="p5.js"></script>
    <script src="p5.play.js"></script>
    <script src="code.js"></script>
    <style>
      /* --- MANDATORY GAME LAB CANVAS OVERRIDES --- */
      html, body {
        background-color: #000000 !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        position: static !important; /* Overrides Code.org's position:fixed bug */
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        font-family: 'Arial Black', Gadget, sans-serif;
        color: #FFFF00;
      }

      /* Game Title Header */
      h1 {
        font-size: 2.5rem;
        margin-top: 30px;
        margin-bottom: 20px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
        z-index: 10;
      }

      /* Horizontal Flex Row wrapping everything */
      .game-layout {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        width: 100%;
        max-width: 1100px;
        z-index: 10;
      }

      /* Side columns holding your buttons stable */
      .side-panel {
        width: 220px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Neon Yellow Arcade Buttons */
      .btn {
        background-color: #FFFF00;
        color: #000000;
        border: none;
        padding: 14px 32px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        transition: transform 0.1s ease, background-color 0.2s ease;
        white-space: nowrap;
        box-shadow: 0 4px 10px rgba(255, 255, 0, 0.2);
      }

      .btn:hover {
        background-color: #e6e600;
        transform: scale(1.05);
      }

      /* Native Game Sketch Container Wrapper */
      #sketch.web {
        display: block !important;
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        transform: none !important;
        width: 400px !important;
        height: 565px !important;
        box-shadow: 0 0 25px rgba(255, 255, 0, 0.25);
        border-radius: 4px;
        background-color: #111 !important;
      }

      /* --- CONTROLS OVERLAY POPUP MODAL --- */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.95);
        z-index: 2000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      .modal-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 100%;
      }

      .controls-image {
        width: 100%;
        max-width: 1000px;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
      }

      /* Mobile Stacking Safe Fallback */
      @media (max-width: 950px) {
        html, body { overflow-y: auto !important; }
        .game-layout { flex-direction: column; gap: 25px; }
        .side-panel { width: auto; }
      }
    </style>
  </head>
  <body class="web">

    <h1>ICE Defense: Minneapolis</h1>

    <div class="game-layout">
        <div class="side-panel">
            <button class="btn" onclick="openControls()">Controls</button>
        </div>
        
        <div id="sketch" class="web"></div>
        
        <div class="side-panel">
            <button class="btn" onclick="location.reload();">Restart Game</button>
        </div>
    </div>

    <div id="soft-buttons" style="display: none">
      <button id="leftButton" disabled class="arrow"></button>
      <button id="rightButton" disabled class="arrow"></button>
      <button id="upButton" disabled class="arrow"></button>
      <button id="downButton" disabled class="arrow"></button>
    </div>
    <div id="studio-dpad" style="display: none"></div>
    <div id="studio-action1" style="display: none"></div>
    <div id="studio-action2" style="display: none"></div>

    <div id="controlsModal" class="modal-overlay">
        <div class="modal-content">
            <img src="controlPage.png" alt="Game Controls" class="controls-image">
            <button class="btn" onclick="closeControls()">Back To Game</button>
        </div>
    </div>

    <script>
        function openControls() {
            document.getElementById('controlsModal').style.display = 'flex';
        }

        function closeControls() {
            document.getElementById('controlsModal').style.display = 'none';
        }

        // Catch directional inputs so the browser view doesn't jump during active gameplay
        window.addEventListener("keydown", function(e) {
            if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>
  </body>
</html>
